# The local rehearsal of Veil's multi-machine test (docs/DEPLOY.md §4,
# docs/REPRODUCE.md): the paid topology on one machine, small. Three
# YugabyteDB nodes (profile `yb`; or PostgreSQL 17, profile `pg`), MinIO
# standing in for Spaces, two servers on the one database and bucket,
# HAProxy in front of them (the one address), and the load driver.
# deploy/compose/rehearsal.sh brings it up in order and runs the gates;
# every variable below comes from the env file it writes.
#
# Every container has a memory limit; the defaults add up to under 12 GB.
x-server: &server
  image: veil-server:${TAG:?set TAG}
  command: ["--listen", "0.0.0.0:8443", "--data", "/var/lib/veil", "--db-connections", "${DB_CONNECTIONS:-16}",
            "--s3-endpoint", "http://minio:9000", "--s3-bucket", "veil-rehearsal", "--tls-cert", "/tls/server.pem", "--tls-key", "/tls/server-key.pem",
            "--device-rate", "1000000000/1000000000", "--anonymous-rate", "1000000000/1000000000", "--max-connections", "262144"]
  mem_limit: ${HUB_MEM:-1g}
  ulimits: { nofile: { soft: 1048576, hard: 1048576 } }

x-yb: &yb
  image: ${YB_IMAGE:?set YB_IMAGE}
  profiles: ["yb"]
  mem_limit: ${YB_MEM:-2304m}
  ulimits: { nofile: { soft: 1048576, hard: 1048576 } }
  volumes: []
  healthcheck:
    test: ["CMD-SHELL", "bin/ysqlsh -h $$(hostname) -tAc 'select 1' >/dev/null"]
    interval: 3s
    timeout: 5s
    retries: 200

services:
  yb1:
    <<: *yb
    hostname: yb1
    command: ["bin/yugabyted", "start", "--background=false", "--advertise_address=yb1", "--tserver_flags=${YB_TSERVER_FLAGS}", "--master_flags=${YB_MASTER_FLAGS}"]
    volumes: [yb1data:/root/var]
  yb2:
    <<: *yb
    hostname: yb2
    command: ["bin/yugabyted", "start", "--background=false", "--advertise_address=yb2", "--join=yb1", "--tserver_flags=${YB_TSERVER_FLAGS}", "--master_flags=${YB_MASTER_FLAGS}"]
    volumes: [yb2data:/root/var]
  yb3:
    <<: *yb
    hostname: yb3
    command: ["bin/yugabyted", "start", "--background=false", "--advertise_address=yb3", "--join=yb1", "--tserver_flags=${YB_TSERVER_FLAGS}", "--master_flags=${YB_MASTER_FLAGS}"]
    volumes: [yb3data:/root/var]

  postgres:
    image: ${PG_IMAGE:?set PG_IMAGE}
    profiles: ["pg"]
    command: ["postgres", "-c", "max_connections=1000", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "shared_buffers=512MB"]
    mem_limit: ${PG_MEM:-3g}
    shm_size: 512m
    environment:
      POSTGRES_USER: veil
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      POSTGRES_DB: veil
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/10-veil.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veil -d veil && psql -U veil -d veil -tAc 'select 1' >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 60

  minio:
    # MinIO no longer publishes images on Docker Hub; this is the server
    # binary as Bitnami last packaged it (docs/HUB.md §13.1).
    image: ${MINIO_IMAGE:?set MINIO_IMAGE}
    mem_limit: ${MINIO_MEM:-512m}
    environment:
      MINIO_ROOT_USER: ${S3_KEY:?set S3_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET:?set S3_SECRET}
    volumes:
      - miniodata:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9000'"]
      interval: 2s
      timeout: 3s
      retries: 60

  # The migrations run once, before any server starts (BUG-838).
  migrate:
    image: veil-server:${TAG}
    command: ["migrate"]
    mem_limit: 512m
    environment:
      VEIL_DATABASE_URL: ${DB_URL_1:?set DB_URL_1}

  hub1:
    <<: *server
    environment:
      VEIL_DATABASE_URL: ${DB_URL_1}
      VEIL_S3_ACCESS_KEY: ${S3_KEY}
      VEIL_S3_SECRET_KEY: ${S3_SECRET}
    volumes:
      - hub1data:/var/lib/veil
      - ${TLS_DIR:?set TLS_DIR}:/tls:ro

  # Servers behind one address are one server to a client: the second
  # gets the first's identity, receipt key, grant key and cache token
  # (configure.sh does the same over SSH).
  hub2-keys:
    image: veil-server:${TAG}
    user: "0"
    entrypoint: ["sh", "-c", "cd /hub1 && cp hub-identity.json hub-receipt-key hub-grant-key hub-cache-token /hub2/ && chown 10001:10001 /hub2/hub-* && chmod 600 /hub2/hub-*"]
    mem_limit: 64m
    volumes:
      - hub1data:/hub1:ro
      - hub2data:/hub2

  hub2:
    <<: *server
    environment:
      VEIL_DATABASE_URL: ${DB_URL_2:?set DB_URL_2}
      VEIL_S3_ACCESS_KEY: ${S3_KEY}
      VEIL_S3_SECRET_KEY: ${S3_SECRET}
    volumes:
      - hub2data:/var/lib/veil
      - ${TLS_DIR}:/tls:ro

  # The balancer: HAProxy, TLS passed through (deploy/lb/haproxy-cfg.sh).
  lb:
    image: ${HAPROXY_IMAGE:?set HAPROXY_IMAGE}
    mem_limit: 256m
    ulimits: { nofile: { soft: 1048576, hard: 1048576 } }
    volumes:
      - ${LB_CFG:?set LB_CFG}:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "127.0.0.1:${LB_PORT:-18443}:8443"

  # The load driver: `docker compose run --rm bench load --url https://lb:8443 …`.
  # Its database URL is for the statement and commit counters only.
  bench:
    image: veil-bench:${TAG}
    profiles: ["bench"]
    mem_limit: ${BENCH_MEM:-2g}
    ulimits: { nofile: { soft: 1048576, hard: 1048576 } }
    environment:
      VEIL_DATABASE_URL: ${DB_URL_1}
      VEIL_S3_ACCESS_KEY: ${S3_KEY}
      VEIL_S3_SECRET_KEY: ${S3_SECRET}
    volumes:
      - benchwork:/work
      - ${RESULTS_DIR:?set RESULTS_DIR}:/work/results
      - ${TLS_DIR}:/tls:ro

volumes:
  yb1data:
  yb2data:
  yb3data:
  pgdata:
  miniodata:
  hub1data:
  hub2data:
  benchwork:
