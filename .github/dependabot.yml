# Dependabot keeps the pinned dependencies current: the commit SHAs of the
# GitHub Actions (with their version comments) and the Cargo dependencies.
# Updates are grouped into one pull request per ecosystem per week; CI runs
# on each.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # release.yml is generated by dist from dist-workspace.toml, which pins
    # its actions in [dist.github-action-commits]; an edit to release.yml
    # alone would fail the `dist plan` drift check. Bump those pins in
    # dist-workspace.toml and run `dist generate` (docs/RELEASING.md).
    exclude-paths:
      - .github/workflows/release.yml
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # The cryptography crates are pinned to exact versions (root
      # Cargo.toml, docs/CRYPTO.md §1) so a review covers what ships: keep
      # their bumps in a pull request of their own, to review against
      # docs/CRYPTO.md. (A dependency joins the first group it matches.)
      crypto:
        patterns:
          - aes-siv
          - chacha20poly1305
          - ed25519-dalek
          - getrandom
          - hkdf
          - hpke
          - sha2
          - x25519-dalek
      # Other patch and minor releases together; a new major gets its own PR.
      cargo-compatible:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
