# Publishes the Homebrew formula for a release.
#
# Runs when the Release workflow (release.yml, generated by dist) finishes
# successfully for a tag, or by hand ("Run workflow", with a tag) to publish
# again, e.g. after the tap token was added. It:
#
# 1. downloads the release's `vl-<target>.tar.xz.sha256` files;
# 2. renders packaging/homebrew/vl.rb.in into `vl.rb` (installs the binary,
#    bash/zsh/fish completions and man pages) and checks its syntax;
# 3. attaches `vl.rb` to the GitHub Release;
# 4. pushes it to `Formula/vl.rb` in the tap, if the HOMEBREW_TAP_TOKEN
#    secret is set (a fine-grained token with "Contents: read and write" on
#    the tap repository). Prereleases are never pushed to the tap.
#
# The tap is <owner>/homebrew-tap unless the HOMEBREW_TAP repository
# variable names another `owner/repo`.
#
# Security: `workflow_run` runs this file from the default branch, never
# from a pull request, and checks out the default branch, not the release's
# code. The tag (a dispatch input, or the Release run's `head_branch`) only
# reaches scripts through `env:`, and is checked as a SemVer tag before any
# command sees it. Only `formula` can write, and only to this repository's
# Releases; the tap is written with HOMEBREW_TAP_TOKEN.
name: Publish Homebrew formula

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v1.0.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-homebrew
  cancel-in-progress: false

jobs:
  formula:
    # Release also runs on pull requests (`dist plan` only): skip those.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # gh release upload
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
      TAP: ${{ vars.HOMEBREW_TAP || format('{0}/homebrew-tap', github.repository_owner) }}
      HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Before any command sees it: a dispatched tag is arbitrary text.
      - name: Check the tag
        run: packaging/homebrew/render-formula.sh --check-tag "$TAG"
      - name: Render the formula
        id: render
        shell: bash
        run: |
          set -euo pipefail
          prerelease=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)
          mkdir sums
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir sums --pattern 'vl-*.tar.xz.sha256'
          packaging/homebrew/render-formula.sh "$TAG" sums "$GITHUB_REPOSITORY" > vl.rb
          ruby -c vl.rb
          cat vl.rb
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - name: Attach the formula to the GitHub Release
        run: gh release upload "$TAG" vl.rb --clobber --repo "$GITHUB_REPOSITORY"
      - name: Check out the tap
        if: env.HAS_TAP_TOKEN == 'true' && steps.render.outputs.prerelease != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.TAP }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Push the formula to the tap
        if: env.HAS_TAP_TOKEN == 'true' && steps.render.outputs.prerelease != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tap/Formula
          cp vl.rb tap/Formula/vl.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/vl.rb
          if git diff --cached --quiet; then
            echo "The tap already has this formula."
          else
            git commit -m "vl $TAG"
            git push
          fi
      - name: Explain a skipped tap push
        if: env.HAS_TAP_TOKEN != 'true'
        run: echo "::warning::HOMEBREW_TAP_TOKEN is not set; vl.rb was attached to the $TAG release but not pushed to $TAP."
