# Nightly (and on demand): the deep property tests and the benchmarks, on
# Linux and macOS. Benchmarks only print their numbers (no thresholds):
# shared runners are too noisy to gate on; compare runs by eye.
name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      proptest_cases:
        description: PROPTEST_CASES for the property tests
        required: false
        default: "2000"
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  props:
    name: property tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      PROPTEST_CASES: ${{ inputs.proptest_cases || '2000' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # adversarial_props, plus every adversarial2_* suite that uses proptest.
      # Each is a module of a test binary (crates/<crate>/tests/<binary>/<module>.rs),
      # so run that binary filtered to the module.
      - name: Property tests (PROPTEST_CASES=${{ env.PROPTEST_CASES }})
        shell: bash
        run: |
          set -euo pipefail
          status=0
          for file in crates/veil-core/tests/*/adversarial_props.rs crates/*/tests/*/adversarial2_*.rs; do
            [ -f "$file" ] || continue
            grep -q 'proptest' "$file" || continue
            crate=$(basename "$(dirname "$(dirname "$(dirname "$file")")")")
            test=$(basename "$(dirname "$file")")
            module=$(basename "$file" .rs)
            echo "::group::$crate --test $test $module::"
            cargo test --release --locked -p "$crate" --test "$test" -- "$module::" || status=1
            echo "::endgroup::"
          done
          exit "$status"
      - name: Keep proptest regressions
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proptest-regressions-${{ matrix.os }}
          path: crates/*/tests/**/*.proptest-regressions
          if-no-files-found: ignore

  bench:
    name: benchmarks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build benchmarks
        run: cargo test --release --locked --no-run -p veil-core --test core_bench --test core_security -p vl --test cli_bench
      # `--ignored --exact` with these names runs only the benchmarks (the
      # binaries also hold bug reproductions and other measurements). One
      # thread, so they do not compete with each other.
      - name: Run benchmarks
        shell: bash
        env:
          # scanner_real_world scans a real tree: this repository's sources.
          VEIL_SCAN_DIR: ${{ github.workspace }}/crates
        run: |
          set -euo pipefail
          cargo test --release --locked -p veil-core --test core_bench --test core_security -p vl --test cli_bench \
            -- --ignored --nocapture --test-threads=1 --exact \
            storage_bench::storage_benchmark scanner::scanner_throughput scanner::scanner_real_world \
            bench_status::status_on_20k_files 2>&1 | tee bench.txt
      - name: Summary
        if: always()
        shell: bash
        env:
          OS: ${{ matrix.os }}
        run: |
          {
            echo "### Benchmarks on $OS"
            echo '```text'
            cat bench.txt 2>/dev/null || echo "(no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
