# Build, test and lint on every push and pull request, on Linux and macOS.
#
#   test       cargo build / test (incl. doc tests) / clippy / cargo doc, all -D warnings
#   musl       the static Linux binaries releases ship (x86_64 and aarch64)
#   wasm       veil-core without an OS or the zstd C library: built for
#              wasm32-unknown-unknown, tested natively with the same
#              features, and the example run under node (scripts/check-wasm.sh)
#   packaging  completions, man pages, Homebrew formula, dist config, actionlint
#
# The deeper property tests and the benchmarks run in nightly.yml; releases
# are built by release.yml (generated by dist, see docs/RELEASING.md).
name: CI

on:
  push:
    branches: [main, integration]
  pull_request:
  workflow_dispatch:

# Least privilege: every job only reads the repository (and says so itself).
# Actions are pinned to commit SHAs (Dependabot keeps them current, see
# .github/dependabot.yml); downloaded tools are checked against a pinned
# SHA-256 before they run.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Tests spawn `sh`, `sleep` and `true` (always present) and, for SFTP
      # remotes, `ssh` and `sftp-server`. macOS ships OpenSSH, including
      # /usr/libexec/sftp-server; Ubuntu runners have the client only.
      # `vl ws exec` is confined by bubblewrap on Linux.
      - name: Install OpenSSH and bubblewrap (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-client openssh-server openssh-sftp-server bubblewrap
      - name: Show test tools
        run: |
          command -v sh sleep true ssh
          ls -l /usr/lib/openssh/sftp-server /usr/libexec/sftp-server 2>/dev/null || true
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --all-targets --no-fail-fast --locked
      - name: Doc tests
        run: cargo test --workspace --doc --no-fail-fast --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Docs build without warnings (broken intra-doc links, …)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  musl:
    name: musl (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TARGET: ${{ matrix.target }}
      # The `cc` crate (zstd's C code) finds musl-gcc by itself only on x86_64.
      CC_aarch64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust and musl
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup toolchain install stable --profile minimal --target "$TARGET"
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --locked -p vl --target "$TARGET"
      - name: Check that the binary is static and runs
        run: |
          vl="target/$TARGET/debug/vl"
          file "$vl"
          file "$vl" | grep -Eq 'statically linked|static-pie linked'
          "$vl" --version
          export VEIL_HOME="$RUNNER_TEMP/veil-home"
          mkdir "$RUNNER_TEMP/repo"
          cd "$RUNNER_TEMP/repo"
          echo hello > hello.txt
          "$GITHUB_WORKSPACE/$vl" init
          "$GITHUB_WORKSPACE/$vl" commit -m "first"
          "$GITHUB_WORKSPACE/$vl" log
          "$GITHUB_WORKSPACE/$vl" doctor

  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node (preinstalled on the runner) runs the example's WebAssembly
      # module; it needs no other tool (no wasm-bindgen).
      - name: Install Rust and the wasm32 target
        run: |
          rustup toolchain install stable --profile minimal --component clippy --target wasm32-unknown-unknown
          rustup default stable
          node --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: wasm
      - name: Portable engine (build for wasm32, test natively, run under node)
        run: scripts/check-wasm.sh

  packaging:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust and checkers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh fish groff-base ruby
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build
        run: cargo build --locked -p vl
      - name: Shell completions parse
        run: |
          vl=target/debug/vl
          "$vl" completions bash > vl.bash && bash -n vl.bash
          bash -c 'source ./vl.bash && complete -p vl'
          "$vl" completions zsh > _vl && zsh -n _vl
          "$vl" completions fish > vl.fish && fish --no-execute vl.fish
      - name: Man pages render without warnings
        run: |
          mkdir man
          target/debug/vl man --out-dir man
          target/debug/vl man > vl-single.1
          for page in man/*.1 vl-single.1; do
            out=$(groff -k -man -Tutf8 -ww -z "$page" 2>&1)
            if [ -n "$out" ]; then echo "$page: $out"; exit 1; fi
          done
          set -- man/*.1
          echo "$# pages"
      - name: Homebrew formula template renders
        run: |
          mkdir sums
          for t in aarch64-apple-darwin x86_64-apple-darwin aarch64-unknown-linux-musl x86_64-unknown-linux-musl; do
            echo "$(printf '%064d' 0) *vl-$t.tar.xz" > "sums/vl-$t.tar.xz.sha256"
          done
          packaging/homebrew/render-formula.sh v0.0.0 sums > vl.rb
          ruby -c vl.rb
          packaging/homebrew/render-formula.sh v1.2.3-rc.1 sums > vl-rc.rb
          ruby -c vl-rc.rb
          # Tags that are not plain SemVer are refused (BUG-067): quotes
          # would be Ruby code in the formula, `|` a sed command.
          # shellcheck disable=SC2016 # `$(id)` is meant literally
          for tag in 'v1.2.3";system "id";"' 'v1.2.3|g;1e id;s|x' 'v1.2.3$(id)' \
                     "$(printf 'v1.2.3\nx')" v1.2 v01.2.3 1.2.3 --help; do
            if packaging/homebrew/render-formula.sh "$tag" sums > /dev/null 2>&1; then
              echo "::error::render-formula.sh accepted a hostile tag"
              exit 1
            fi
          done
      # The dist release binary, checked against a pinned SHA-256 (not its
      # installer piped to sh). Keep DIST_VERSION equal to
      # `cargo-dist-version` in dist-workspace.toml; the hash is the
      # `cargo-dist-x86_64-unknown-linux-gnu.tar.xz.sha256` of that release
      # (see docs/RELEASING.md, "Updating dist").
      - name: Release config is consistent (dist plan)
        env:
          DIST_VERSION: 0.34.0
          DIST_SHA256: 7fee44ff3ff71ed0064b32d4ec62fee6b58bd37c5887b12a86aedddc5af0c7b5
        run: |
          set -euo pipefail
          grep -qx "cargo-dist-version = \"$DIST_VERSION\"" dist-workspace.toml || {
            echo "::error::DIST_VERSION in ci.yml differs from cargo-dist-version in dist-workspace.toml"
            exit 1
          }
          name=cargo-dist-x86_64-unknown-linux-gnu
          curl --proto '=https' --tlsv1.2 -LsSf -o "$RUNNER_TEMP/$name.tar.xz" \
            "https://github.com/axodotdev/cargo-dist/releases/download/v${DIST_VERSION}/$name.tar.xz"
          echo "$DIST_SHA256  $RUNNER_TEMP/$name.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$name.tar.xz" -C "$RUNNER_TEMP"
          dist="$RUNNER_TEMP/$name/dist"
          "$dist" --version
          # Fails if .github/workflows/release.yml is out of date with
          # dist-workspace.toml or .github/build-setup.yml.
          "$dist" plan
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --proto '=https' --tlsv1.2 -LsSf -o "$RUNNER_TEMP/$tarball" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tarball"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
