# Build, test and lint on every push and pull request, on Linux and macOS.
#
#   test       cargo build / test (incl. doc tests) / clippy -D warnings
#   musl       the static Linux binaries releases ship (x86_64 and aarch64)
#   packaging  completions, man pages, Homebrew formula, dist config, actionlint
#
# The deeper property tests and the benchmarks run in nightly.yml; releases
# are built by release.yml (generated by dist, see docs/RELEASING.md).
name: CI

on:
  push:
    branches: [main, integration]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustc --version
      - uses: Swatinem/rust-cache@v2.9.3
      # Tests spawn `sh`, `sleep` and `true` (always present) and, for SFTP
      # remotes, `ssh` and `sftp-server`. macOS ships OpenSSH, including
      # /usr/libexec/sftp-server; Ubuntu runners have the client only.
      - name: Install OpenSSH (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-client openssh-server openssh-sftp-server
      - name: Show test tools
        run: |
          command -v sh sleep true ssh
          ls -l /usr/lib/openssh/sftp-server /usr/libexec/sftp-server 2>/dev/null || true
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --all-targets --no-fail-fast --locked
      - name: Doc tests
        run: cargo test --workspace --doc --no-fail-fast --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  musl:
    name: musl (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      TARGET: ${{ matrix.target }}
      # The `cc` crate (zstd's C code) finds musl-gcc by itself only on x86_64.
      CC_aarch64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust and musl
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup toolchain install stable --profile minimal --target "$TARGET"
          rustup default stable
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --locked -p vl --target "$TARGET"
      - name: Check that the binary is static and runs
        run: |
          vl="target/$TARGET/debug/vl"
          file "$vl"
          file "$vl" | grep -Eq 'statically linked|static-pie linked'
          "$vl" --version
          export VEIL_HOME="$RUNNER_TEMP/veil-home"
          mkdir "$RUNNER_TEMP/repo"
          cd "$RUNNER_TEMP/repo"
          echo hello > hello.txt
          "$GITHUB_WORKSPACE/$vl" init
          "$GITHUB_WORKSPACE/$vl" commit -m "first"
          "$GITHUB_WORKSPACE/$vl" log
          "$GITHUB_WORKSPACE/$vl" doctor

  packaging:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust and checkers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh fish groff-base ruby
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Build
        run: cargo build --locked -p vl
      - name: Shell completions parse
        run: |
          vl=target/debug/vl
          "$vl" completions bash > vl.bash && bash -n vl.bash
          bash -c 'source ./vl.bash && complete -p vl'
          "$vl" completions zsh > _vl && zsh -n _vl
          "$vl" completions fish > vl.fish && fish --no-execute vl.fish
      - name: Man pages render without warnings
        run: |
          mkdir man
          target/debug/vl man --out-dir man
          target/debug/vl man > vl-single.1
          for page in man/*.1 vl-single.1; do
            out=$(groff -k -man -Tutf8 -ww -z "$page" 2>&1)
            if [ -n "$out" ]; then echo "$page: $out"; exit 1; fi
          done
          set -- man/*.1
          echo "$# pages"
      - name: Homebrew formula template renders
        run: |
          mkdir sums
          for t in aarch64-apple-darwin x86_64-apple-darwin aarch64-unknown-linux-musl x86_64-unknown-linux-musl; do
            echo "$(printf '%064d' 0) *vl-$t.tar.xz" > "sums/vl-$t.tar.xz.sha256"
          done
          packaging/homebrew/render-formula.sh v0.0.0 sums > vl.rb
          ruby -c vl.rb
      - name: Release config is consistent (dist plan)
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.34.0/cargo-dist-installer.sh | sh
          # Fails if .github/workflows/release.yml is out of date with
          # dist-workspace.toml or .github/build-setup.yml.
          dist plan
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -LsSf -o "$RUNNER_TEMP/$tarball" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tarball"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
