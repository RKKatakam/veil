[workspace]
resolver = "2"
members = ["crates/veil-core", "crates/vl", "crates/veil-bench", "crates/veil-server"]
# The scale benchmark (crates/veil-bench) and the server (crates/veil-server)
# build only when asked for (`-p …` or `--workspace`): `cargo test
# --all-targets` skips them.
default-members = ["crates/veil-core", "crates/vl"]
# A copy of sqlx-core 0.8.6 with one change (BUG-1909), patched in below.
exclude = ["vendor/sqlx-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.88"
repository = "https://github.com/veil-vcs/veil"
homepage = "https://github.com/veil-vcs/veil"

[workspace.dependencies]
veil-core = { path = "crates/veil-core" }
anyhow = "1"
blake3 = "1.8" # `hazmat`: pack checksums computed while streaming (BUG-800)
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.6"
clap_mangen = "0.3"
diffy = "0.4"
globset = "0.4"
hex = "0.4"
libc = "0.2"
memchr = "2"
aho-corasick = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
unicode-normalization = "0.1"
zeroize = { version = "1", features = ["derive"] }
zstd = { version = "0.14", default-features = false }
# Pure-Rust zstd *decoder*, for builds without the C library (WASM).
ruzstd = { version = "0.9", default-features = false, features = ["std"] }

# Cryptography: exact versions, so a security review covers exactly what
# ships (see docs/CRYPTO.md). Bump deliberately, together with that review.
aes-siv = { version = "=0.8.0", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
ed25519-dalek = { version = "=3.0.0", features = ["zeroize"] }
getrandom = { version = "=0.4.3", features = ["sys_rng"] }
hkdf = "=0.13.0"
hpke = { version = "=0.15.1", default-features = false, features = ["alloc", "x25519", "chacha"] }
sha2 = { version = "=0.11.1", default-features = false }
x25519-dalek = { version = "=3.0.0", features = ["static_secrets", "zeroize"] }

[profile.release]
lto = "thin"
codegen-units = 1

# The profile `dist` builds release archives with (see dist-workspace.toml).
[profile.dist]
inherits = "release"

# BUG-1909: sqlx-core 0.8.6 (the newest 0.8) forgives, for `sslmode=verify-ca`,
# only the name error older rustls versions gave, so `verify-ca` also checked the
# certificate's name. `vendor/sqlx-core` is 0.8.6 unchanged but for that match
# (`src/net/tls/tls_rustls.rs`, `NoHostnameTlsVerifier`) and its lints
# silenced; sqlx 0.9 has the same fix. Remove this when moving to sqlx 0.9.
[patch.crates-io]
sqlx-core = { path = "vendor/sqlx-core" }
