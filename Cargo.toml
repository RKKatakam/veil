[workspace]
resolver = "2"
members = ["crates/veil-core", "crates/vl"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.80"
repository = "https://github.com/veil-vcs/veil"
homepage = "https://github.com/veil-vcs/veil"

[workspace.dependencies]
veil-core = { path = "crates/veil-core" }
anyhow = "1"
blake3 = "1.5"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.6"
clap_mangen = "0.3"
diffy = "0.4"
ed25519-dalek = { version = "2", features = ["zeroize"] }
getrandom = "0.2"
globset = "0.4"
hex = "0.4"
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
unicode-normalization = "0.1"
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
zeroize = { version = "1", features = ["derive"] }
zstd = { version = "0.14", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1

# The profile `dist` builds release archives with (see dist-workspace.toml).
[profile.dist]
inherits = "release"
