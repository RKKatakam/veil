[workspace]
members = ["cargo:."]

# Config for 'dist' (https://github.com/axodotdev/cargo-dist).
# See docs/RELEASING.md. After editing, run `dist generate` to refresh
# .github/workflows/release.yml (CI fails if the two drift apart).
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# The installers to generate for each app. Homebrew is not one of them: dist's
# formula cannot install completions or man pages, so
# .github/workflows/publish-homebrew.yml renders packaging/homebrew/vl.rb.in
# once a release is out. (It is a separate workflow rather than a dist
# `publish-jobs` entry: dist 0.34 renders custom jobs as `uses: $/...`.)
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax).
# Linux builds are static musl binaries: they run on any distribution.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-musl",
    "x86_64-unknown-linux-musl",
]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Checksums for every archive, plus one sha256.sum file for the release
checksum = "sha256"
# Release archives (macOS and Linux both get .tar.xz)
unix-archive = ".tar.xz"
# Which actions to run on pull requests ("plan" checks the release config)
pr-run-mode = "plan"
# Shell completions and man pages, generated by the build-setup steps
# (.github/build-setup.yml) from the vl being released.
github-build-setup = "../build-setup.yml"

# The actions of the generated release.yml, pinned to commit SHAs (dist
# writes `uses: <action>@<sha>`). These are what dist 0.34's own tags
# (`checkout@v6`, `upload-artifact@v7`, `download-artifact@v8`) pointed at
# when pinned. Dependabot does not edit release.yml: to update, take the
# new tag's commit (`git ls-remote https://github.com/<action> 'refs/tags/<tag>*'`,
# the `^{}` line for an annotated tag), change it here and in the comment,
# then run `dist generate` (docs/RELEASING.md, "Maintenance").
[dist.github-action-commits]
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803" # v6.1.0
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2
