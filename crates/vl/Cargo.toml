[package]
name = "vl"
description = "Veil command-line interface"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "vl"
path = "src/main.rs"

[dependencies]
veil-core.workspace = true
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true
diffy = { workspace = true }
hex.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true

# Release archives (see dist-workspace.toml): shell completions and man
# pages generated from this vl by .github/build-setup.yml.
[package.metadata.dist]
include = ["../../target/vl-extras/completions", "../../target/vl-extras/man"]
