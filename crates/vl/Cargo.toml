[package]
name = "vl"
description = "Veil command-line interface"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "vl"
path = "src/main.rs"

[dependencies]
veil-core.workspace = true
anyhow.workspace = true
# `.veilhooks` trust: digests of the files a hook runs.
blake3.workspace = true
chrono.workspace = true
clap.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true
diffy = { workspace = true }
hex.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
# `.veilhooks` (parsing only; already in the tree through proc-macro-crate).
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# `vl ws mount` (FUSE). Pure Rust on Linux: mounting goes through
# `fusermount3`, no libfuse needed. On macOS it needs macFUSE, so it is
# opt-in there: `cargo build --features macfuse`.
[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.18", optional = true, default-features = false }
[target.'cfg(target_os = "macos")'.dependencies]
fuser_macos = { package = "fuser", version = "0.18", optional = true, default-features = false }

[features]
default = ["fuse"]
# `vl ws mount` on Linux (no effect elsewhere).
fuse = ["dep:fuser"]
# `vl ws mount` on macOS: needs macFUSE (https://macfuse.github.io) to build and run.
macfuse = ["fuse", "dep:fuser_macos"]

[dev-dependencies]
tempfile.workspace = true
proptest = "1"

# Release archives (see dist-workspace.toml): shell completions and man
# pages generated from this vl by .github/build-setup.yml.
[package.metadata.dist]
include = ["../../target/vl-extras/completions", "../../target/vl-extras/man"]
