[package]
name = "veil-core"
description = "Storage engine for Veil: VFS backends, cryptographic CAS, snapshot DAG and operation log"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
aes-siv.workspace = true
blake3.workspace = true
chacha20poly1305.workspace = true
diffy.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true
globset.workspace = true
hkdf.workspace = true
hpke.workspace = true
hex.workspace = true
memchr.workspace = true
aho-corasick.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
unicode-normalization.workspace = true
x25519-dalek.workspace = true
zeroize.workspace = true
zstd = { workspace = true, optional = true }
ruzstd = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true, optional = true }

# Features (see docs/ARCHITECTURE.md, "Builds without an operating system").
# The defaults are the native build `vl` ships; `--no-default-features
# --features wasm` is the portable engine that builds for
# wasm32-unknown-unknown (scripts/check-wasm.sh).
[features]
default = ["os", "zstd"]
# A real operating system: `DiskBackend`, `SftpBackend` (spawns `ssh`),
# process checks in the repository lock and its heartbeat thread, worker
# threads, and the system clock as the default clock.
os = ["dep:libc"]
# The zstd C library: compressed and delta pack entries are written (gc,
# sync) and read with it.
zstd = ["dep:zstd"]
# The pure-Rust zstd decoder: reads every pack entry without the C library.
# Without `zstd`, packs are written with stored entries only.
ruzstd = ["dep:ruzstd"]
# The portable engine for wasm32-unknown-unknown: the pure-Rust decoder and
# WebCrypto randomness (getrandom's `wasm_js` backend; no effect elsewhere).
# Use with `--no-default-features`.
wasm = ["ruzstd", "getrandom/wasm_js"]

# Native only: neither builds for wasm32-unknown-unknown, and the WASM
# example (`examples/wasm_smoke.rs`) needs none of them.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
tempfile.workspace = true
proptest = "1"

[lints.rust]
# `examples/wasm_smoke.rs` supplies randomness itself when built with
# `--cfg getrandom_backend="custom"` (scripts/check-wasm.sh).
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(getrandom_backend, values("custom"))'] }
