  <text x="48.0" y="258.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#f8fafc" text-anchor="start">status · 1 GB (watcher running*)</text>
  <text x="440.0" y="258.0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="700" fill="#34d399" text-anchor="end">5.4× faster</text>
