  <text x="42.0" y="346.0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16.5" font-weight="700" fill="#a78bfa" text-anchor="start">&lt; 300 ms</text>
  <text x="42.0" y="364.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#f8fafc" text-anchor="start">200k-File Workspace</text>
  <text x="42.0" y="378.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.0" font-weight="400" fill="#8b9bb4" text-anchor="start">288 ms cold / 259 ms warm start</text>
  <rect x="247" y="322" width="207" height="68" rx="10" fill="#151d2e" stroke="#243047" stroke-width="1"/>
