  <text x="28.0" y="58.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="start">Faster Than Git on Real Workloads — With Crash-Safe Commits</text>
  <text x="28.0" y="77.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8b9bb4" text-anchor="start">Same-machine medians on identical files (1 GB / 35,000-file project &amp; 10,000-file import). Shorter bar = faster.</text>
