  <text x="706.0" y="273.5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="700" fill="#fbbf24" text-anchor="start">8.1 ms</text>
  <rect x="480" y="279" width="216.0" height="10" rx="3" fill="#182235"/>
  <rect x="480" y="279" width="53.3" height="10" rx="3" fill="url(#slateGrad)"/>
