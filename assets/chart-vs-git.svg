  <text x="480.0" y="258.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#f8fafc" text-anchor="start">log -n 20 · 1 GB (watcher running)</text>
  <text x="872.0" y="258.0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="700" fill="#fbbf24" text-anchor="end">Git wins</text>
