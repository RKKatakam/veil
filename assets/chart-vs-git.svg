  <text x="46.0" y="120.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#8b9bb4" text-anchor="start">Normalized to slower tool = 100% per operation  (shorter is faster)</text>
  <text x="48.0" y="150.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#f8fafc" text-anchor="start">Default clone · 1 GB (thin vs full)</text>
