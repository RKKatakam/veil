  <text x="261.0" y="364.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#f8fafc" text-anchor="start">Failover Integrity Pass</text>
  <text x="261.0" y="378.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.0" font-weight="400" fill="#8b9bb4" text-anchor="start">10,473/10,473 once (2.46s max gap)</text>
  <rect x="466" y="322" width="207" height="68" rx="10" fill="#151d2e" stroke="#243047" stroke-width="1"/>
  <text x="480.0" y="346.0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16.5" font-weight="700" fill="#38bdf8" text-anchor="start">6 – 22 ms</text>
  <text x="480.0" y="364.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#f8fafc" text-anchor="start">100,000 Pull Requests</text>
  <text x="480.0" y="378.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.0" font-weight="400" fill="#8b9bb4" text-anchor="start">Median list, search, open &amp; update</text>
  <rect x="685" y="322" width="207" height="68" rx="10" fill="#151d2e" stroke="#243047" stroke-width="1"/>
  <text x="699.0" y="346.0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16.5" font-weight="700" fill="#fbbf24" text-anchor="start">3,540+ Tests</text>
  <text x="699.0" y="364.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#f8fafc" text-anchor="start">Green Correctness Suite</text>
  <text x="699.0" y="378.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.0" font-weight="400" fill="#8b9bb4" text-anchor="start">~970 server (PG+YB) · ~2,570 client</text>
  <text x="28.0" y="404.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.0" font-weight="400" fill="#64748b" text-anchor="start">* Client vs. Git on 32-core NVMe (2026-11-12, pre-append-only). With daemon stopped, status is 63–68 ms. Failover on GCP (2026-11-21; 2s max-gap target missed at 2.46s).</text>
