  <text x="706.0" y="179.5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.6" font-weight="400" fill="#8b9bb4" text-anchor="start">811 ms</text>
  <text x="480.0" y="204.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#f8fafc" text-anchor="start">Commit 1 file · 1 GB (watcher + fsync)</text>
  <text x="872.0" y="204.0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="end">durable fsync</text>
  <rect x="480" y="211" width="216.0" height="10" rx="3" fill="#182235"/>
  <rect x="480" y="211" width="152.5" height="10" rx="3" fill="url(#veilGrad)"/>
