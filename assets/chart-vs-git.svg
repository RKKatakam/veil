  <text x="274.0" y="287.5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.6" font-weight="400" fill="#8b9bb4" text-anchor="start">31.5 ms</text>
  <text x="480.0" y="150.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#f8fafc" text-anchor="start">Import folder · 10,000 files</text>
  <text x="872.0" y="150.0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="700" fill="#34d399" text-anchor="end">2.7× faster</text>
  <rect x="480" y="157" width="216.0" height="10" rx="3" fill="#182235"/>
  <rect x="480" y="157" width="81.0" height="10" rx="3" fill="url(#veilGrad)"/>
  <text x="706.0" y="165.5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="700" fill="#a78bfa" text-anchor="start">304 ms</text>
  <rect x="480" y="171" width="216.0" height="10" rx="3" fill="#182235"/>
