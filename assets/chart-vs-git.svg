<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 412" width="920" height="412" role="img" aria-label="Veil vs Git Client Speed on a 1 GB Repository and Operational Gates">
  <title>Veil vs Git Client Speed on a 1 GB Repository and Operational Gates</title>
