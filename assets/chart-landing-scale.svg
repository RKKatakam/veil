  <text x="28.0" y="399.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.3" font-weight="400" fill="#64748b" text-anchor="start">† Scion's 30,000+/day is Anthropic's daily usage on a ~100 GB monorepo — not its ceiling. Veil runs used small synthetic repos held 3–10 min.</text>
